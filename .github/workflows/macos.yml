name: macOS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm build:ui

      - name: Check and test
        run: |
          cargo fmt --check
          cargo clippy -p folio-core -p folio-cli --all-targets -- -D warnings
          cargo test -p folio-core -p folio-cli
          cargo test -p folio-app --lib
          pnpm typecheck

      # Signing and update signing are optional: fork and pull-request builds
      # have no secrets and still produce a DMG. A tag build with the secrets
      # set additionally signs the app and emits `Folio.app.tar.gz` + `.sig`,
      # which is what the updater installs.
      - name: Build universal app and DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri treats an empty variable as a configured one, so drop the
          # blanks before it looks at them.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            pnpm tauri build --target universal-apple-darwin --bundles app,dmg \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            pnpm tauri build --target universal-apple-darwin --bundles app,dmg
          fi

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/universal-apple-darwin/release/bundle/macos/Folio.app \
            target/universal-apple-darwin/release/Folio.app.zip

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: folio-macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: folio-macos-app-zip
          path: target/universal-apple-darwin/release/Folio.app.zip
          if-no-files-found: error

      - name: Build update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tarball=target/universal-apple-darwin/release/bundle/macos/Folio.app.tar.gz
          if [ ! -f "$tarball" ]; then
            echo "::warning::No updater artifact, so this release has no update feed. Set TAURI_SIGNING_PRIVATE_KEY to publish one."
            exit 0
          fi
          node scripts/release-manifest.mjs \
            --tag "$GITHUB_REF_NAME" \
            --tarball "$tarball" \
            --signature "$tarball.sig" \
            --out target/universal-apple-darwin/release/latest.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/Folio.app.zip
          )
          # The updater fetches latest.json from `releases/latest/download`, so
          # the manifest and the artifact it signs must land in the same release.
          tarball=target/universal-apple-darwin/release/bundle/macos/Folio.app.tar.gz
          if [ -f "$tarball" ]; then
            assets+=("$tarball" "$tarball.sig" target/universal-apple-darwin/release/latest.json)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Folio $tag" \
              --generate-notes
          fi
