name: macOS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm build:ui

      - name: Check and test
        run: |
          cargo fmt --check
          cargo clippy -p folio-core -p folio-cli --all-targets -- -D warnings
          cargo test -p folio-core -p folio-cli
          cargo test -p folio-app --lib
          pnpm typecheck

      - name: Build universal app and DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/universal-apple-darwin/release/bundle/macos/Folio.app \
            target/universal-apple-darwin/release/Folio.app.zip

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: folio-macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: folio-macos-app
          path: target/universal-apple-darwin/release/bundle/macos/Folio.app
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/Folio.app.zip
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Folio $tag" \
              --generate-notes
          fi
