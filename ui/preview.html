<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Preview — Folio</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
      }

      body {
        display: flex;
        color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }

      .preview-status {
        position: fixed;
        inset: 0;
        display: grid;
        margin: 0;
        padding: 32px;
        place-items: center;
        background: #faf9f6;
        color: #636366;
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <iframe
      id="preview-frame"
      title="HTML preview"
      sandbox=""
      referrerpolicy="no-referrer"
    ></iframe>
    <p class="preview-status" id="preview-status" hidden></p>
    <script type="module" src="preview.js"></script>
  </body>
</html>
